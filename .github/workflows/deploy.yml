name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-chifoumi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (node --test)
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@77.42.23.215 'bash -s' <<'EOF'
          set -euo pipefail
          REPO=https://github.com/JimmyDore/chifoumi.git
          DIR=/root/chifoumi
          if [ -d "$DIR/.git" ]; then
            cd "$DIR"
            git fetch --prune origin
            git checkout -B main origin/main
          else
            git clone "$REPO" "$DIR"
            cd "$DIR"
          fi
          docker compose up -d --build
          docker image prune -f
          EOF

  health:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://chifoumi.jimmydore.fr/health || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed on attempt $i"
              curl -fsS https://chifoumi.jimmydore.fr/health
              exit 0
            fi
            echo "Attempt $i: health='$code', retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 30 attempts"
          exit 1
