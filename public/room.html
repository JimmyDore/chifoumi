<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chifoumi</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
</head>
<body>
  <main>
    <div class="logo">
      <span class="fists">✊ ✋ ✌️</span>
      <h1>Chifoumi</h1>
    </div>

    <!-- Duel introuvable / expiré -->
    <div id="screen-notfound" class="card hidden">
      <p class="result-text">😕 Duel introuvable ou expiré.</p>
      <a href="/" class="btn" style="text-align:center;text-decoration:none;display:block">Créer un nouveau duel</a>
    </div>

    <!-- Duel complet (troisième visiteur) -->
    <div id="screen-full" class="card hidden">
      <p class="result-text">🚪 Duel complet !</p>
      <p class="status">Deux joueurs s’affrontent déjà ici.</p>
      <a href="/" class="btn" style="text-align:center;text-decoration:none;display:block">Créer mon propre duel</a>
    </div>

    <!-- Deuxième joueur : saisie du pseudo -->
    <form id="screen-join" class="card hidden">
      <p class="result-text">⚔️ On te défie en duel !</p>
      <p class="status" id="join-details"></p>
      <div>
        <label for="join-pseudo">Ton pseudo</label>
        <input type="text" id="join-pseudo" maxlength="24" required
               autocomplete="nickname" placeholder="Jimmy">
      </div>
      <button type="submit" class="btn">Relever le défi 🥊</button>
    </form>

    <!-- Partage du lien (créateur en attente) -->
    <div id="screen-share" class="card hidden">
      <p class="result-text">🔗 Envoie ce lien à ton adversaire</p>
      <div class="share-box">
        <input type="text" id="share-url" readonly>
        <button class="btn" id="copy-btn" type="button">Copier</button>
        <button class="btn secondary hidden" id="share-btn" type="button">Partager</button>
      </div>
      <p class="copied" id="copy-feedback"></p>
    </div>

    <!-- Duel -->
    <div id="screen-game" class="card hidden">
      <p class="stake-banner hidden" id="stake-banner"></p>

      <div class="scoreboard">
        <div class="side">
          <div class="pname" id="you-name">…</div>
          <div class="pstate" id="you-state"></div>
        </div>
        <div class="points" id="score">0 — 0</div>
        <div class="side">
          <div class="pname" id="opp-name">…</div>
          <div class="pstate" id="opp-state"></div>
        </div>
      </div>

      <p class="round-info" id="round-info"></p>

      <div class="countdown hidden" id="countdown"></div>

      <div class="arena hidden" id="arena">
        <span class="fighter left" id="arena-you">✊</span>
        <span class="vs">VS</span>
        <span class="fighter" id="arena-opp">✊</span>
      </div>

      <p class="result-text" id="result-text"></p>

      <div class="hands" id="hands">
        <button class="hand" data-choice="pierre">✊<small>Pierre</small></button>
        <button class="hand" data-choice="feuille">✋<small>Feuille</small></button>
        <button class="hand" data-choice="ciseaux">✌️<small>Ciseaux</small></button>
      </div>

      <div class="final hidden" id="final">
        <div class="trophy">🏆</div>
        <h2 id="final-title"></h2>
        <p class="loser-stake hidden" id="final-stake"></p>
        <button class="btn" id="rematch-btn" type="button">Revanche 🔁</button>
      </div>
    </div>

    <p class="status" id="conn-status"></p>
  </main>
  <footer><a href="/">← Créer un autre duel</a></footer>
  <script src="/room.js"></script>
</body>
</html>
