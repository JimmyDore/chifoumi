<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chifoumi</title>
  <meta name="description" content="Pierre, feuille, ciseaux à distance — pour trancher les petites décisions du quotidien.">
  <meta name="theme-color" content="#1c0b40">
  <link rel="stylesheet" href="/style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
</head>
<body class="home">
  <main>
    <header class="hero">
      <div class="fists"><span>✊</span><span>✋</span><span>✌️</span></div>
      <h1>Chifoumi</h1>
      <p class="tagline">Pierre, feuille, ciseaux à distance — pour trancher les petits litiges.</p>
    </header>

    <form id="create-form" class="card">
      <div class="field">
        <label for="pseudo">Ton pseudo</label>
        <input type="text" id="pseudo" name="pseudo" maxlength="24" required
               autocomplete="nickname" placeholder="Marie">
      </div>

      <div class="field">
        <label for="stake">Celui qui perd… <span class="opt">(optionnel)</span></label>
        <input type="text" id="stake" name="stake" maxlength="140"
               placeholder="fait la vaisselle">
      </div>

      <div class="field">
        <label>Format</label>
        <div class="formats">
          <label>
            <input type="radio" name="bestOf" value="1" checked>
            <span>Un seul coup</span>
          </label>
          <label>
            <input type="radio" name="bestOf" value="3">
            <span>Meilleur des 3</span>
          </label>
          <label>
            <input type="radio" name="bestOf" value="5">
            <span>Meilleur des 5</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn" id="create-btn">Créer le duel ⚔️</button>
      <p class="form-error" id="create-error"></p>
    </form>
  </main>
  <script src="/home.js?v=3"></script>
</body>
</html>
